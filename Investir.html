    /* Fond GIF plein écran */

      margin: 0;

    /* Logo */
    #logo {
      width: 150px;
      margin-top: 40px;
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }

    /* Conteneur des boutons */
    .menu {
      margin-top: 50px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 40px;
    }

    /* Boutons images rotatifs */
    .btn {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.4s;
      border: 3px solid white;
    }

    .btn:hover {
      transform: rotateY(360deg) scale(1.1);
    }

    .btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Titre sous chaque bouton */
    .label {
      margin-top: 10px;
      font-size: 18px;
      font-weight: bold;
      text-shadow: 0 0 8px black;
    }
  </style>
